<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bomb Maze | FunDrivenDev</title><style>*{box-sizing:border-box}body{margin:0;background:#10152b;color:#fff;font:16px system-ui;text-align:center}h1{margin:15px;color:#ffda55;letter-spacing:3px}canvas{display:block;max-width:96vw;max-height:68vh;aspect-ratio:17/13;margin:auto;border:5px solid #6679ac;image-rendering:pixelated;background:#242e48}button{touch-action:manipulation;background:#344b7e;color:white;border:2px solid #92a5d0;border-radius:10px;padding:13px 19px;font-size:20px;cursor:pointer}button:active{background:#f49b38}.pad{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:5px;margin:10px}.pad button{padding:9px}#stats{margin:8px}small{color:#b9c6e9}</style><h1>💣 BOMB MAZE</h1><div id="stats"></div><canvas id="game" width="680" height="520" aria-label="Arena Bomb Maze"></canvas><div><button id="restart">↻ Reiniciar</button> <button id="bomb">💣 Bomba</button></div><div class="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><small>WASD / setas para mover · Espaço para bomba · R para reiniciar</small><script>
(()=>{'use strict';const W=17,H=13,T=40,cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),stats=document.querySelector('#stats');let map,player,enemies,bombs,flames,power,score,over,win,last=0,step=0;const dirs=[[1,0],[-1,0],[0,1],[0,-1]],rand=n=>Math.floor(Math.random()*n),key=(x,y)=>x+','+y;function reset(){map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0)?1:Math.random()<.57?2:0));player={x:1,y:1,lives:3,range:2,max:1,speed:1,shield:0};enemies=[{x:15,y:1},{x:15,y:11},{x:1,y:11}].map(e=>({...e,alive:true,next:0}));for(const p of [player,...enemies])for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)if(x>0&&y>0&&x<W-1&&y<H-1&&map[y][x]!==1)map[y][x]=0;bombs=[];flames=[];power=[];score=0;over=false;win=false;last=performance.now();step=0}function free(x,y){return x>=0&&y>=0&&x<W&&y<H&&map[y][x]===0&&!bombs.some(b=>b.x===x&&b.y===y)}function move(dx,dy){if(over)return;for(let i=0;i<player.speed;i++){let x=player.x+dx,y=player.y+dy;if(!free(x,y))break;player.x=x;player.y=y;pickup();hit()}}function pickup(){let i=power.findIndex(p=>p.x===player.x&&p.y===player.y);if(i<0)return;let p=power.splice(i,1)[0];if(p.type===0)player.range=Math.min(6,player.range+1);if(p.type===1)player.max=Math.min(5,player.max+1);if(p.type===2)player.speed=Math.min(2,player.speed+1);score+=50}function plant(){if(over||bombs.filter(b=>b.owner==='p').length>=player.max||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:performance.now()+1900,range:player.range,owner:'p'})}function blast(b,now){let cells=[[b.x,b.y]];for(const [dx,dy]of dirs)for(let i=1;i<=b.range;i++){let x=b.x+dx*i,y=b.y+dy*i;if(map[y]?.[x]===undefined||map[y][x]===1)break;cells.push([x,y]);if(map[y][x]===2){map[y][x]=0;score+=10;if(Math.random()<.23)power.push({x,y,type:rand(3)});break}}for(const [x,y]of cells){flames.push({x,y,until:now+450});for(const other of bombs)if(other.x===x&&other.y===y)other.t=Math.min(other.t,now+30)}hit();}function hit(){if(over)return;const dangerous=flames.some(f=>f.x===player.x&&f.y===player.y)||enemies.some(e=>e.alive&&e.x===player.x&&e.y===player.y);if(dangerous&&performance.now()>player.shield){player.lives--;player.shield=performance.now()+1600;if(player.lives<=0)over=true}for(const e of enemies)if(e.alive&&flames.some(f=>f.x===e.x&&f.y===e.y)){e.alive=false;score+=200}if(enemies.every(e=>!e.alive)){over=true;win=true}}function ai(now){for(const e of enemies){if(!e.alive||now<e.next)continue;e.next=now+330+rand(320);const options=dirs.map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>free(p.x,p.y)&&!flames.some(f=>f.x===p.x&&f.y===p.y));if(options.length){const p=options[rand(options.length)];e.x=p.x;e.y=p.y}}hit()}function rect(x,y,c,p=0){ctx.fillStyle=c;ctx.fillRect(x*T+p,y*T+p,T-p*2,T-p*2)}function draw(now){ctx.clearRect(0,0,680,520);for(let y=0;y<H;y++)for(let x=0;x<W;x++){rect(x,y,(x+y)%2?'#283e4b':'#2d4651');if(map[y][x]===1){rect(x,y,'#6176a0',2);rect(x,y,'#8b9ac1',5);ctx.fillStyle='#394e78';ctx.fillRect(x*T+6,y*T+20,28,4)}else if(map[y][x]===2){rect(x,y,'#93582f',3);ctx.strokeStyle='#e2a663';ctx.lineWidth=3;ctx.strokeRect(x*T+7,y*T+7,26,26);ctx.beginPath();ctx.moveTo(x*T+8,y*T+8);ctx.lineTo(x*T+32,y*T+32);ctx.stroke()}}for(const p of power){rect(p.x,p.y,['#f7d548','#74ddf2','#bc8aff'][p.type],9);ctx.fillStyle='#17253c';ctx.font='bold 20px monospace';ctx.fillText(['+','B','»'][p.type],p.x*T+13,p.y*T+27)}for(const b of bombs){ctx.fillStyle='#121725';ctx.beginPath();ctx.arc(b.x*T+20,b.y*T+22,13,0,7);ctx.fill();ctx.fillStyle='#ffdd73';ctx.fillRect(b.x*T+18,b.y*T+5,5,9)}for(const f of flames){rect(f.x,f.y,'#ff6d25',3);rect(f.x,f.y,'#ffe45b',11)}for(const e of enemies)if(e.alive){rect(e.x,e.y,'#e84e68',7);ctx.fillStyle='white';ctx.fillRect(e.x*T+13,e.y*T+15,5,5);ctx.fillRect(e.x*T+24,e.y*T+15,5,5)}if(Math.floor(now/120)%2||now>player.shield){rect(player.x,player.y,'#56c7f0',6);ctx.fillStyle='#102a51';ctx.fillRect(player.x*T+12,player.y*T+16,6,5);ctx.fillRect(player.x*T+24,player.y*T+16,6,5)}stats.textContent='❤ '+player.lives+'   💣 '+player.max+'   🔥 '+player.range+'   ★ '+score+'   👾 '+enemies.filter(e=>e.alive).length;if(over){ctx.fillStyle='#080d1bcc';ctx.fillRect(0,170,680,160);ctx.textAlign='center';ctx.font='bold 44px monospace';ctx.fillStyle=win?'#ffe66d':'#ff7e86';ctx.fillText(win?'VITÓRIA!':'GAME OVER',340,240);ctx.font='20px monospace';ctx.fillStyle='white';ctx.fillText('Pressione R ou Reiniciar',340,280);ctx.textAlign='start'}}function frame(now){if(!over){for(const b of [...bombs])if(now>=b.t){bombs.splice(bombs.indexOf(b),1);blast(b,now)}flames=flames.filter(f=>f.until>now);if(now-step>140){ai(now);step=now}hit()}draw(now);requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(d){e.preventDefault();move(...d)}if(e.code==='Space'){e.preventDefault();plant()}if(k==='r')reset()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(...b.dataset.dir.split(',').map(Number))));document.querySelector('#bomb').onclick=plant;document.querySelector('#restart').onclick=reset;reset();requestAnimationFrame(frame)})();
</script></html>
