<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bomb Maze | FunDrivenDev</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#29315e,#10152b 65%);color:#fff;font:16px system-ui;text-align:center;min-height:100vh}h1{margin:15px;color:#ffda55;letter-spacing:3px;text-shadow:3px 3px #8c375d,-2px -2px #1e7992}canvas{display:block;max-width:96vw;max-height:68vh;aspect-ratio:17/13;margin:auto;border:6px solid #a3b4ec;box-shadow:0 0 0 5px #172341,0 18px 48px #05081699;image-rendering:pixelated;background:#242e48}button{touch-action:manipulation;background:#344b7e;color:white;border:2px solid #92a5d0;border-radius:10px;padding:13px 19px;font-size:20px;cursor:pointer}button:active{background:#f49b38}.pad{display:grid;grid-template-columns:repeat(3,65px);justify-content:center;gap:5px;margin:10px}.pad button{padding:9px}#stats{margin:12px auto;padding:8px 16px;max-width:680px;background:#1b2849;border:2px solid #435a84;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}#sound[aria-pressed=true]{border-color:#ffe07d;color:#ffe07d}small{color:#b9c6e9}</style><h1>💣 BOMB MAZE</h1><div id="stats"></div><canvas id="game" width="680" height="520" aria-label="Arena Bomb Maze"></canvas><div><button id="restart">↻ Reiniciar</button> <button id="sound" aria-pressed="false" aria-label="Ativar efeitos sonoros">🔇 Som</button> <button id="bomb">💣 Bomba</button></div><div class="pad"><span></span><button data-dir="0,-1">▲</button><span></span><button data-dir="-1,0">◀</button><button data-dir="0,1">▼</button><button data-dir="1,0">▶</button></div><small>WASD / setas para mover · Espaço para bomba · R para reiniciar</small><script>
(()=>{'use strict';const W=17,H=13,T=40,cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),stats=document.querySelector('#stats');let map,player,enemies,bombs,flames,power,score,over,win,last=0,step=0,particles=[],audio=null,soundOn=false,ended=false;const soundBtn=document.querySelector('#sound');function tone(freq,duration=.12,type='square',volume=.05,slide=0){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;osc.type=type;osc.frequency.setValueAtTime(Math.max(30,freq),t);if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);gain.gain.setValueAtTime(volume,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+duration)}catch(_){}}function sparkle(x,y,color,amount=12){for(let i=0;i<amount;i++){const a=Math.random()*Math.PI*2,v=1+Math.random()*3;particles.push({x:x*T+20,y:y*T+20,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:24+rand(15),color})}if(particles.length>240)particles.splice(0,particles.length-240)}const dirs=[[1,0],[-1,0],[0,1],[0,-1]],rand=n=>Math.floor(Math.random()*n),key=(x,y)=>x+','+y;function reset(){map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0)?1:Math.random()<.57?2:0));player={x:1,y:1,lives:3,range:2,max:1,speed:1,shield:0};enemies=[{x:15,y:1},{x:15,y:11},{x:1,y:11}].map(e=>({...e,alive:true,next:0}));for(const p of [player,...enemies])for(let y=p.y-1;y<=p.y+1;y++)for(let x=p.x-1;x<=p.x+1;x++)if(x>0&&y>0&&x<W-1&&y<H-1&&map[y][x]!==1)map[y][x]=0;bombs=[];flames=[];power=[];score=0;over=false;win=false;last=performance.now();step=0;particles=[];ended=false}function free(x,y){return x>=0&&y>=0&&x<W&&y<H&&map[y][x]===0&&!bombs.some(b=>b.x===x&&b.y===y)}function move(dx,dy){if(over)return;for(let i=0;i<player.speed;i++){let x=player.x+dx,y=player.y+dy;if(!free(x,y))break;player.x=x;player.y=y;tone(155,.025,'triangle',.012);pickup();hit()}}function pickup(){let i=power.findIndex(p=>p.x===player.x&&p.y===player.y);if(i<0)return;let p=power.splice(i,1)[0];if(p.type===0)player.range=Math.min(6,player.range+1);if(p.type===1)player.max=Math.min(5,player.max+1);if(p.type===2)player.speed=Math.min(2,player.speed+1);score+=50;sparkle(player.x,player.y,'#ffe580',16);tone(660,.16,'square',.04,340)}function plant(){if(over||bombs.filter(b=>b.owner==='p').length>=player.max||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:performance.now()+1900,range:player.range,owner:'p'});tone(260,.08,'triangle',.045,-130)}function blast(b,now){tone(110,.3,'sawtooth',.09,-70);sparkle(b.x,b.y,'#ffbb54',24);let cells=[[b.x,b.y]];for(const [dx,dy]of dirs)for(let i=1;i<=b.range;i++){let x=b.x+dx*i,y=b.y+dy*i;if(map[y]?.[x]===undefined||map[y][x]===1)break;cells.push([x,y]);if(map[y][x]===2){map[y][x]=0;score+=10;sparkle(x,y,'#e9a55e',10);if(Math.random()<.23)power.push({x,y,type:rand(3)});break}}for(const [x,y]of cells){flames.push({x,y,until:now+450});for(const other of bombs)if(other.x===x&&other.y===y)other.t=Math.min(other.t,now+30)}hit();}function hit(){if(over)return;const dangerous=flames.some(f=>f.x===player.x&&f.y===player.y)||enemies.some(e=>e.alive&&e.x===player.x&&e.y===player.y);if(dangerous&&performance.now()>player.shield){player.lives--;tone(210,.28,'sawtooth',.08,-160);sparkle(player.x,player.y,'#8de6ff',22);player.shield=performance.now()+1600;if(player.lives<=0)over=true}for(const e of enemies)if(e.alive&&flames.some(f=>f.x===e.x&&f.y===e.y)){e.alive=false;score+=200;sparkle(e.x,e.y,'#ff6c9b',24);tone(510,.2,'square',.05,-250)}if(!over&&enemies.every(e=>!e.alive)){over=true;win=true}if(over&&!ended){ended=true;tone(win?740:150,.45,win?'triangle':'sawtooth',.07,win?330:-100)}}function ai(now){for(const e of enemies){if(!e.alive||now<e.next)continue;e.next=now+330+rand(320);const options=dirs.map(([dx,dy])=>({x:e.x+dx,y:e.y+dy})).filter(p=>free(p.x,p.y)&&!flames.some(f=>f.x===p.x&&f.y===p.y));if(options.length){const p=options[rand(options.length)];e.x=p.x;e.y=p.y}}hit()}function rect(x,y,c,p=0){ctx.fillStyle=c;ctx.fillRect(x*T+p,y*T+p,T-p*2,T-p*2)}function draw(now){ctx.clearRect(0,0,680,520);const tick=Math.floor(now/160);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x*T,py=y*T,wall=map[y][x];rect(x,y,(x+y)%2?'#243b4b':'#294354');ctx.fillStyle='#345566';ctx.fillRect(px+4,py+5,3,3);ctx.fillRect(px+29,py+30,3,3);if(wall===1){rect(x,y,'#37456e',1);ctx.fillStyle='#8da5d1';ctx.fillRect(px+3,py+3,34,7);ctx.fillRect(px+3,py+13,14,5);ctx.fillRect(px+21,py+13,16,5);ctx.fillStyle='#536a9c';ctx.fillRect(px+3,py+23,34,6);ctx.fillStyle='#27375a';ctx.fillRect(px+17,py+13,4,9);ctx.fillRect(px+3,py+34,34,3)}else if(wall===2){rect(x,y,'#4b2c38',3);rect(x,y,'#9a583f',6);ctx.fillStyle='#d9955a';ctx.fillRect(px+8,py+8,24,4);ctx.fillRect(px+8,py+28,24,4);ctx.fillStyle='#653a37';ctx.fillRect(px+17,py+8,6,24);ctx.fillRect(px+8,py+17,24,6);ctx.fillStyle='#ffca79';ctx.fillRect(px+10,py+10,4,4)}}for(const p of power){const bob=Math.sin(now/240+p.x)*3;ctx.fillStyle='#0d2036';ctx.fillRect(p.x*T+9,p.y*T+12+bob,24,24);ctx.fillStyle=['#f6d45d','#72e6f4','#bb92ff'][p.type];ctx.fillRect(p.x*T+11,p.y*T+9+bob,18,18);ctx.fillStyle='#13223a';ctx.font='bold 18px monospace';ctx.fillText(['+','B','»'][p.type],p.x*T+14,p.y*T+25+bob)}for(const b of bombs){const pulse=1+Math.sin(now/95)*.12,px=b.x*T+20,py=b.y*T+22;ctx.fillStyle='#0b1122';ctx.fillRect(px-14*pulse,py-13*pulse,28*pulse,27*pulse);ctx.fillStyle='#454c75';ctx.fillRect(px-10,py-10,9,7);ctx.fillStyle='#a3b1da';ctx.fillRect(px-7,py-8,4,4);ctx.fillStyle=(Math.floor(now/130)%2)?'#ffb653':'#ff5d55';ctx.fillRect(px-1,py-20,5,9)}for(const f of flames){const intensity=Math.max(0,Math.min(1,(f.until-now)/450)),inset=3+Math.sin(now/42+f.x)*2;rect(f.x,f.y,'#c73b45',2);rect(f.x,f.y,'#ff812f',inset+2);rect(f.x,f.y,'#ffe27a',11+Math.sin(now/45)*2);ctx.fillStyle='#fff6c2';ctx.fillRect(f.x*T+17,f.y*T+17,6,6);if(intensity<.3){ctx.fillStyle='#ff9b4b';ctx.fillRect(f.x*T+8,f.y*T+7,4,4)}}for(const e of enemies)if(e.alive){const bob=(tick%2)*2,px=e.x*T,py=e.y*T+bob;ctx.fillStyle='#702b55';ctx.fillRect(px+7,py+13,26,22);ctx.fillStyle='#f06683';ctx.fillRect(px+9,py+7,22,24);ctx.fillRect(px+6,py+18,28,10);ctx.fillStyle='#ffb2ae';ctx.fillRect(px+12,py+11,16,5);ctx.fillStyle='#202642';ctx.fillRect(px+13,py+17,5,6);ctx.fillRect(px+23,py+17,5,6);ctx.fillStyle='#9b315f';ctx.fillRect(px+10,py+31,7,5);ctx.fillRect(px+23,py+31,7,5)}if(Math.floor(now/120)%2||now>player.shield){const px=player.x*T,py=player.y*T+(tick%2),ctxColor='#55c9f2';ctx.fillStyle='#123b63';ctx.fillRect(px+8,py+10,24,25);ctx.fillStyle=ctxColor;ctx.fillRect(px+10,py+7,20,23);ctx.fillRect(px+7,py+16,26,11);ctx.fillStyle='#a2f2ff';ctx.fillRect(px+12,py+9,16,6);ctx.fillStyle='#162b50';ctx.fillRect(px+13,py+17,5,6);ctx.fillRect(px+23,py+17,5,6);ctx.fillStyle='#264e88';ctx.fillRect(px+10,py+31,7,5);ctx.fillRect(px+23,py+31,7,5)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/39);ctx.fillStyle=p.color;ctx.fillRect(Math.round(p.x),Math.round(p.y),4,4)}ctx.globalAlpha=1;stats.textContent='❤ '+player.lives+'   💣 '+player.max+'   🔥 '+player.range+'   ★ '+score+'   👾 '+enemies.filter(e=>e.alive).length;if(over){ctx.fillStyle='#080d1be0';ctx.fillRect(0,170,680,160);ctx.textAlign='center';ctx.font='bold 44px monospace';ctx.fillStyle=win?'#ffe66d':'#ff7e86';ctx.fillText(win?'VITÓRIA!':'GAME OVER',340,240);ctx.font='20px monospace';ctx.fillStyle='white';ctx.fillText('Pressione R ou Reiniciar',340,280);ctx.textAlign='start'}}function frame(now){for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--}particles=particles.filter(p=>p.life>0);if(!over){for(const b of [...bombs])if(now>=b.t){bombs.splice(bombs.indexOf(b),1);blast(b,now)}flames=flames.filter(f=>f.until>now);if(now-step>140){ai(now);step=now}hit()}draw(now);requestAnimationFrame(frame)}document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(d){e.preventDefault();move(...d)}if(e.code==='Space'){e.preventDefault();plant()}if(k==='r')reset()});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(...b.dataset.dir.split(',').map(Number))));soundBtn.onclick=()=>{soundOn=!soundOn;soundBtn.setAttribute('aria-pressed',String(soundOn));soundBtn.textContent=soundOn?'🔊 Som':'🔇 Som';soundBtn.setAttribute('aria-label',soundOn?'Desativar efeitos sonoros':'Ativar efeitos sonoros');if(soundOn)tone(520,.12,'triangle',.05,200)};document.querySelector('#bomb').onclick=plant;document.querySelector('#restart').onclick=reset;reset();requestAnimationFrame(frame)})();
</script></html>
