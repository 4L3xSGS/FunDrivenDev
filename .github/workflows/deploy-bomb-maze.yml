name: Deploy Bomb Maze to GitHub Pages
on:
  push:
    branches: [main]
    paths:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar arquivos antes da publicação
        run: |
          python3 scripts/check.py
          node tests/bomb-maze-smoke.cjs
          grep -q 'id="sound"' games/bomb-maze/index.html
          grep -q 'Bomb Maze' index.html
          echo "$GITHUB_SHA" > deployment-version.txt
          touch .nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
