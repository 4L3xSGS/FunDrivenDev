name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verificar estrutura, links e scripts
        run: python3 scripts/check.py
      - name: Smoke test Bomb Maze (jogabilidade e áudio)
        run: node tests/bomb-maze-smoke.cjs
      - name: Testar Duelo de Tanques em Chromium (toque e teclado)
        run: |
          npm install --prefix "$RUNNER_TEMP/tanks-browser" --no-package-lock --no-audit --no-fund --ignore-scripts playwright-core@1.55.0
          NODE_PATH="$RUNNER_TEMP/tanks-browser/node_modules" node tests/duelo-mobile.cjs
