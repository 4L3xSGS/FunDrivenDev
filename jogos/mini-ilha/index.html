<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Ilha 4.1 — Cidade Viva</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b28;color:#f1f6f5;font:14px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{margin:4px 0}.muted{color:#a6bac5}.stats,.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:12px 0}.stat,.panel{background:#1d3040;border:1px solid #385263;border-radius:12px;padding:10px}.stat{text-align:center}.stat b{display:block;font-size:22px}button{background:#304b5c;color:white;border:1px solid #628394;border-radius:8px;padding:10px 4px;cursor:pointer}button.active{background:#26805b;border-color:#9de5b3}button:focus-visible{outline:3px solid #ffd36d}button small{display:block;color:#d1e1e5}.panel{margin:12px 0}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation;border-radius:8px;background:#55b7d3}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}#status{min-height:2em;color:#d3e5da}#citizens{line-height:1.8}</style></head><body><main>
<header class="row"><div><h1>🏝️ Mini Ilha 4.1</h1><span class="muted">Cidade Viva · São Paulo, SP</span></div><div><strong id="clock">--:--:--</strong><div id="date" class="muted"></div></div></header>
<section class="panel row"><div><strong id="weather">Consultando clima real…</strong><div class="muted" id="weatherInfo">Fonte: Open-Meteo</div></div><div><b id="period">☀️ Dia</b><div class="muted" id="day">Dia 1</div></div></section>
<div class="stats"><div class="stat">🪵 Madeira<b id="wood"></b></div><div class="stat">🪨 Pedra<b id="stone"></b></div><div class="stat">🥕 Comida<b id="food"></b></div><div class="stat">🪙 Moedas<b id="gold"></b></div><div class="stat">👥 População<b id="pop"></b></div><div class="stat">💚 Felicidade<b id="happy"></b></div></div>
<section class="panel"><canvas id="scene" width="480" height="440" aria-label="Mapa interativo da ilha"></canvas><div class="actions"><button id="pause">⏸ Pausar</button><button id="speed">▶ 1×</button><button id="people">👤 Moradores</button></div></section>
<section class="panel"><h2>Construções</h2><div class="tools" id="tools"></div><div class="actions"><button id="next">Próximo dia</button><button id="next5">+5 dias</button><button id="inspect">Inspecionar</button></div><p id="status" role="status">Construa casas, locais de trabalho e caminhos.</p></section>
<section class="panel"><h2>Vida na ilha</h2><div id="citizens"></div><h3>Objetivos</h3><div id="goals"></div><div class="actions"><button id="save">💾 Salvar</button><button id="load">📂 Carregar</button><button id="reset">↻ Nova ilha</button></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('scene'),c=cv.getContext('2d'),N=10,T=40,O=40,P=20,zone='America/Sao_Paulo';
const defs={house:['Casa',{wood:12,stone:4},0,'🏠'],farm:['Fazenda',{wood:10,gold:5},2,'🌾'],sawmill:['Serraria',{wood:8,stone:6},2,'🪚'],quarry:['Pedreira',{wood:12,gold:8},2,'⛏️'],market:['Mercado',{wood:15,stone:8,gold:10},2,'🏪'],park:['Parque',{wood:8,gold:5},1,'🌳'],road:['Caminho',{stone:2},0,'🛤️']};
let s,tool='house',residents=[],pause=false,speed=1,show=true,frame=0,weather={code:null,temp:null,rain:0,updated:0},lastDate='',last=0;
const nowParts=()=>{let d=new Date(),f=new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);return Object.fromEntries(f.map(v=>[v.type,v.value]))};
const rand=(x,y)=>{let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)};
function fresh(){let grid=Array.from({length:N},(_,y)=>Array.from({length:N},(_,x)=>((x-4.5)/4.9)**2+((y-4.5)/4.8)**2>1.07?'water':rand(x+3,y+7)<.12?'tree':'empty'));for(let y=4;y<6;y++)for(let x=4;x<6;x++)grid[y][x]='empty';return{grid,wood:55,stone:30,food:45,gold:45,happy:75,day:1,simulatedDays:0}};
const count=t=>s.grid.flat().filter(v=>v===t).length,pop=()=>count('house')*3,locs=t=>{let a=[];s.grid.forEach((r,y)=>r.forEach((v,x)=>{if(v===t)a.push({x,y})}));return a};
function jobs(){let a=[];for(let t of ['farm','sawmill','quarry','market','park'])for(let q of locs(t))for(let k=0;k<defs[t][2];k++)a.push({...q,type:t});return a}
function rebuild(){let homes=locs('house'),j=jobs(),old=residents;residents=Array.from({length:pop()},(_,i)=>{let home=homes[Math.floor(i/3)],p=old[i];return{name:['Lia','Theo','Mia','Noah','Bia','Davi','Luna','Caio','Nina','Leo'][i%10],home,job:j[i]||null,x:p?.x??home.x,y:p?.y??home.y,route:[],dest:'',status:'Em casa',color:['#f07169','#66a4e8','#efbd55','#b88bdf'][i%4]}})}
const accessible=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&!['water','tree'].includes(s.grid[y][x]);
function route(a,b){let q=[a],dist={[a.x+','+a.y]:0},prev={};while(q.length){q.sort((u,v)=>dist[u.x+','+u.y]-dist[v.x+','+v.y]);let v=q.shift(),k=v.x+','+v.y;if(v.x===b.x&&v.y===b.y){let out=[v];while(prev[k]){v=prev[k];out.push(v);k=v.x+','+v.y}return out.reverse().slice(1)}for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let x=v.x+dx,y=v.y+dy,n=x+','+y;if(!accessible(x,y))continue;let d=dist[k]+(s.grid[y][x]==='road'?.45:1);if(dist[n]===undefined||d<dist[n]){dist[n]=d;prev[n]=v;if(!q.some(z=>z.x===x&&z.y===y))q.push({x,y})}}}return[]}
function routine(p,h){if(h<6||h>=22)return['Dormindo',p.home];if(h<8)return['Café da manhã',p.home];if(h<12||h>=13&&h<17)return p.job?['Trabalhando',p.job]:['Passeando',locs('park')[0]||p.home];if(h<13)return['Almoçando',locs('market')[0]||p.home];if(h<19)return['Lazer',locs('park')[0]||p.home];return['Jantando',p.home]}
function tickPeople(dt,h){for(let p of residents){let [status,d]=routine(p,h),key=status+':'+d.x+','+d.y;if(p.dest!==key){p.dest=key;p.route=route({x:Math.round(p.x),y:Math.round(p.y)},d)}p.status=status;if(!p.route.length)continue;let t=p.route[0],dx=t.x-p.x,dy=t.y-p.y,len=Math.hypot(dx,dy),step=.035*dt*speed;if(len<=step){p.x=t.x;p.y=t.y;p.route.shift()}else{p.x+=dx/len*step;p.y+=dy/len*step}}}
function daily(){s.day++;let capacity=jobs().length,workers=Math.min(pop(),capacity),f=capacity?workers/capacity:0;s.wood+=Math.floor(count('sawmill')*5*f);s.stone+=Math.floor(count('quarry')*4*f);s.food+=Math.floor(count('farm')*8*f)-Math.ceil(pop()/3);s.gold+=Math.floor(count('market')*6*f)+Math.floor(pop()/3);let hungry=s.food<0;if(hungry)s.food=0;s.happy=Math.max(0,Math.min(100,s.happy+(hungry?-12:1)+count('park')*2-(pop()&&!count('market')?1:0)));$('status').textContent=hungry?'⚠️ Faltam alimentos!':'Dia '+s.day+': produção contabilizada.'}
function draw(){frame++;c.fillStyle='#50b4d4';c.fillRect(0,0,480,440);for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t=s.grid[y][x],px=O+x*T,py=P+y*T;c.fillStyle=t==='water'?(x+y)%2?'#4aa8d0':'#63bfdb':(x+y)%2?'#85c96d':'#98d777';c.fillRect(px,py,T,T);if(t==='water'){c.fillStyle='#a3e1ed';c.fillRect(px+(frame/6+x*7)%32,py+18,9,2)}else if(t==='tree'){c.fillStyle='#80542f';c.fillRect(px+17,py+22,6,15);c.fillStyle='#328b46';c.fillRect(px+9,py+10,23,22);c.fillStyle='#5bb966';c.fillRect(px+14,py+5,14,14)}else if(t==='road'){c.fillStyle='#cdb48b';c.fillRect(px,py+9,40,23);c.fillStyle='#e4cfac';c.fillRect(px,py+19,40,2)}else if(defs[t]){c.font='29px system-ui';c.fillText(defs[t][3],px+5,py+31)}}if(show)for(let p of residents){let x=O+p.x*T+20,y=P+p.y*T+19;c.fillStyle='#f1c49d';c.fillRect(x-3,y-9,7,7);c.fillStyle=p.color;c.fillRect(x-4,y-2,9,9);c.fillStyle='#38485e';c.fillRect(x-3,y+7,3,5);c.fillRect(x+2,y+7,3,5)}
let h=Number(nowParts().hour),dark=h<5?.62:h<7?.62-(h-5)*.31:h<18?0:h<21?(h-18)*.21:.63;if(dark){c.fillStyle='rgba(13,25,65,'+dark+')';c.fillRect(0,0,480,440)}if(weather.rain>0){c.strokeStyle='#c9eaff99';for(let i=0;i<Math.min(90,weather.rain*8+12);i++){let x=(i*67+frame*3)%480,y=(i*97+frame*7)%440;c.beginPath();c.moveTo(x,y);c.lineTo(x-3,y+10);c.stroke()}}}
function update(){let p=nowParts(),date=p.year+'-'+p.month+'-'+p.day,h=Number(p.hour);$('clock').textContent=p.hour+':'+p.minute+':'+p.second;$('date').textContent=p.day+'/'+p.month+'/'+p.year;$('period').textContent=h<6?'🌙 Madrugada':h<9?'🌅 Amanhecer':h<18?'☀️ Dia':h<21?'🌇 Entardecer':'🌙 Noite';$('day').textContent='Dia '+s.day;for(let k of ['wood','stone','food','gold'])$(k).textContent=s[k];$('pop').textContent=pop();$('happy').textContent=s.happy+'%';let gs=[['3 casas',count('house')>=3],['12 habitantes',pop()>=12],['4 caminhos',count('road')>=4],['100 moedas',s.gold>=100],['Dia 20',s.day>=20]];$('goals').textContent=gs.map(([t,ok])=>(ok?'✅ ':'⬜ ')+t).join(' · ');$('citizens').textContent=residents.length?residents.slice(0,8).map(p=>p.name+' — '+p.status).join(' · '):'Construa casas para receber moradores.';if(lastDate&&date!==lastDate)daily();lastDate=date;return h}
async function fetchWeather(){try{let u='https://api.open-meteo.com/v1/forecast?latitude=-23.5505&longitude=-46.6333&current=temperature_2m,precipitation,weather_code&timezone=America%2FSao_Paulo',r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);let d=(await r.json()).current;weather={code:d.weather_code,temp:d.temperature_2m,rain:d.precipitation,updated:Date.now()};$('weather').textContent=(d.precipitation>0?'🌧️ Chuva':d.weather_code>=3?'☁️ Nublado':'☀️ Céu aberto')+' · '+Math.round(d.temperature_2m)+'°C';$('weatherInfo').textContent='São Paulo · Open-Meteo · atualização '+new Date().toLocaleTimeString('pt-BR',{timeZone:zone})}catch(e){$('weather').textContent='🌤️ Clima indisponível';$('weatherInfo').textContent='Não foi possível consultar a API; sem clima simulado.'}}
function action(x,y){let t=s.grid[y][x];if(tool==='inspect'){$('status').textContent='Terreno: '+(defs[t]?.[0]||t);return}if(tool==='clear'){if(t!=='tree')return;s.grid[y][x]='empty';s.wood+=4}else if(tool==='demolish'){if(!defs[t])return;for(let [k,v] of Object.entries(defs[t][1]))s[k]+=Math.floor(v/2);s.grid[y][x]='empty'}else{if(t!=='empty'){$('status').textContent='Terreno ocupado ou água.';return}let d=defs[tool];if(Object.entries(d[1]).some(([k,v])=>s[k]<v)){$('status').textContent='Recursos insuficientes.';return}for(let [k,v] of Object.entries(d[1]))s[k]-=v;s.grid[y][x]=tool}rebuild();update();$('status').textContent='Ação realizada: '+tool}
cv.addEventListener('click',e=>{let r=cv.getBoundingClientRect(),x=Math.floor(((e.clientX-r.left)*480/r.width-O)/T),y=Math.floor(((e.clientY-r.top)*440/r.height-P)/T);if(x>=0&&x<N&&y>=0&&y<N)action(x,y)});
let tools=$('tools');for(let [key,d] of Object.entries(defs)){let b=document.createElement('button');b.dataset.tool=key;b.textContent=d[3]+' '+d[0];let small=document.createElement('small');small.textContent=Object.entries(d[1]).map(([k,v])=>v+' '+({wood:'🪵',stone:'🪨',gold:'🪙'}[k])).join(' ');b.append(small);tools.append(b)}for(let [key,label] of [['clear','🪓 Limpar +4🪵'],['demolish','🔨 Demolir 50%'],['inspect','🔎 Inspecionar']]){let b=document.createElement('button');b.dataset.tool=key;b.textContent=label;tools.append(b)}tools.addEventListener('click',e=>{let b=e.target.closest('button[data-tool]');if(!b)return;tool=b.dataset.tool;tools.querySelectorAll('button').forEach(z=>z.classList.toggle('active',z===b))});tools.querySelector('[data-tool=house]').classList.add('active');
$('inspect').onclick=()=>{tool='inspect';tools.querySelector('[data-tool=inspect]').click()};$('next').onclick=()=>{daily();update()};$('next5').onclick=()=>{for(let i=0;i<5;i++)daily();update()};$('pause').onclick=()=>{pause=!pause;$('pause').textContent=pause?'▶ Retomar':'⏸ Pausar'};$('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent='▶ '+speed+'× (movimento)'};$('people').onclick=()=>{show=!show;$('people').textContent=show?'👤 Moradores':'👤 Ocultos'};$('save').onclick=()=>{try{localStorage.setItem('miniilha-v4-1',JSON.stringify(s));$('status').textContent='Jogo salvo neste navegador.'}catch(e){$('status').textContent='Salvamento indisponível.'}};$('load').onclick=()=>{try{let a=JSON.parse(localStorage.getItem('miniilha-v4-1'));if(!a||a.grid?.length!==N)throw Error();s=a;rebuild();update();$('status').textContent='Jogo carregado.'}catch(e){$('status').textContent='Não há salvamento válido.'}};$('reset').onclick=()=>{if(confirm('Criar nova ilha?')){s=fresh();rebuild();update()}};function loop(t){let dt=Math.min(50,(t-last)||16)/16.67;last=t;if(!pause){tickPeople(dt,Number(nowParts().hour));draw()}requestAnimationFrame(loop)}
s=fresh();rebuild();update();fetchWeather();setInterval(()=>{update()},1000);setInterval(fetchWeather,600000);requestAnimationFrame(loop);
})();
</script></body></html>
